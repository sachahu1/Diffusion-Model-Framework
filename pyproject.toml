[project]
name = "diffusion-model-framework"
version = "1.2.0-rc.2"
description = ""
authors = [{ name = "Sacha Hu", email = "sachahu@mindsparkai.com" }]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "tqdm>=4.66.2,<5",
    "numpy>=2.1.3,<3",
    "torchvision>=0.20.1,<0.21",
    "torch>=2.5.1,<3",
    "pillow>=11.0.0,<12",
]

[project.optional-dependencies]
# Config-driven inference: the `diffusion-models infer` CLI.
inference = [
    "click>=8.1,<9",
    "hydra-core>=1.3.2,<2",
    "hydra-zen>=0.14,<1",
]
# Everything needed to train (includes the inference extra).
training = [
    "diffusion-model-framework[inference]",
    "tensorboard>=2.18.0,<3",
    "transformers>=4.46.1,<5",
]
# FID / KID evaluation of checkpoints.
evaluation = [
    "diffusion-model-framework[inference]",
    "torchmetrics[image]>=1.5,<2",
]

[project.scripts]
diffusion-models = "diffusion_models.cli:main"

[project.urls]
Documentation = "https://www.sachahu.com/docs/diffusion-model-framework/latest/index.html"
Repository = "https://github.com/sachahu1/Diffusion-Model-Framework"

[dependency-groups]
jupyter = ["jupyter>=1.0.0,<2"]
gdown = ["gdown>=5.1.0,<6"]
dev = [
    "ruff>=0.5.5,<0.6",
    "ty>=0.0.105",
]
test = [
    "pytest>=6.2.5,<7",
    "pytest-mock>=3.14.0,<4",
    "coverage[toml]>=6.4.2,<7",
]
documentation = [
    "Sphinx>=7.3.7,<8",
    "sphinxcontrib-napoleon>=0.7,<0.8",
    "sphinx-rtd-theme>=2.0.0,<3",
    "myst-parser>=3.0.1,<4",
    "sphinx-copybutton>=0.5.2,<0.6",
    "sphinx-autoapi>=3.2.1,<4",
    "gitpython>=3.1.43,<4",
]
coco = ["pycocotools>=2.0.8,<3"]

[tool.uv]
default-groups = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["diffusion_models"]

[tool.ruff]
line-length = 79
indent-width = 2
exclude = [".venv", ".env", ".git", "tests"]

[tool.ruff.lint]
# Add the `line-too-long` rule to the enforced rule set. By default, Ruff omits rules that
# overlap with the use of a formatter, like Black, but we can override this behavior by
# explicitly adding the rule.
select = ["NPY201"]
extend-select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ERA", # flake8-eradicate/eradicate
    "I",   # isort
    "N",   # pep8-naming
    "PIE", # flake8-pie
    "PGH", # pygrep
    "RUF", # ruff checks
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "TCH", # flake8-type-checking
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
]
fixable = ["ALL"]
ignore = ["SIM117"]

[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 2
known-first-party = ["diffusion_model-framework"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.semantic_release]
version_variables = [
    "diffusion_models/__init__.py:__version__",
    "docs/source/conf.py:release",
    "docs/source/conf.py:html_context.current_version",
]
version_toml = [
    "pyproject.toml:project.version"
]
upload_to_pypi = false
# Keep uv.lock in sync with the version bump, otherwise `uv sync --locked`
# fails in CI after every release.
build_command = "uv lock"
assets = ["uv.lock"]
upload_to_release = true

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false

[tool.semantic_release.branches.dev]
match = "dev"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.branches."feature/*"]
match = "(feature/*)"
prerelease = true
prerelease_token = "alpha"

[tool.coverage.run]
source = ["diffusion_models"]
