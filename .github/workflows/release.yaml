name: Release

on:
  push:
    branches:
      - main
      - dev

jobs:
  release:
    name: Release pushed tag
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "^3.10.0"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Run on the runner (not through the Docker action) so that the
      # ``build_command`` in pyproject.toml can use ``uv`` to refresh uv.lock.
      - name: Python Semantic Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uvx --from python-semantic-release semantic-release version
          uvx --from python-semantic-release semantic-release publish

      - name: Package build
        run: |
          uv build
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4.3.5
        with:
          name: dist
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs:
      - release
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/diffusion-model-framework
    steps:
      - name: Download a Build Artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: dist
          path: ./dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  trigger-docs:
    runs-on: ubuntu-latest
    needs:
      - release
    permissions:
      actions: write
    steps:
      - name: Invoke Documentation Workflow
        uses: benc-uk/workflow-dispatch@v1.2.4
        with:
          workflow: Build And Release Docs

